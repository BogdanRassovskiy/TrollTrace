{% extends "base.html" %}

{% block title %}Přihlášení{% endblock %}

{% block content %}
  <section class="card auth-card">
    <h1>Přihlášení</h1>
    <p class="muted">Uzavřená výzkumná databáze. Přístup přiděluje výzkumník projektu.</p>

    {% if form.errors %}
      <p class="msg msg-error">Nesprávné uživatelské jméno nebo heslo.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="form">
      {% csrf_token %}
      <label for="id_username">Uživatelské jméno</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autofocus required
             value="{{ form.username.value|default:'' }}">
      <label for="id_password">Heslo</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="button">Přihlásit se</button>
    </form>
  </section>
{% endblock %}
