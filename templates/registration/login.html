{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
  <section class="card auth-card">
    <h1>Вход</h1>
    <p class="muted">Закрытая исследовательская база. Доступ выдаёт исследователь проекта.</p>

    {% if form.errors %}
      <p class="msg msg-error">Неверное имя пользователя или пароль.</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="form">
      {% csrf_token %}
      <label for="id_username">Имя пользователя</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autofocus required
             value="{{ form.username.value|default:'' }}">
      <label for="id_password">Пароль</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="button">Войти</button>
    </form>
  </section>
{% endblock %}
